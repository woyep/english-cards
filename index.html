<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>English Words Cards</title>
    <link rel="stylesheet" href="english-cards.css" />
  </head>
  <body>
    <h1>English Words Cards</h1>

    <div style="margin-bottom: 30px">
      <label for="level-select">Level:</label>
      <select id="level-select">
        <option value="all">All levels</option>
        <option value="starters">Starters</option>
        <option value="movers">Movers</option>
      </select>

      <label for="category-select">Category:</label>
      <select id="category-select">
        <option value="all">All categories</option>
        <option value="animal">Animal</option>
        <option value="body-face">The Body &amp; The Face</option>
        <option value="clothes">Clothes</option>
        <option value="colours">Colours</option>
        <option value="family-friends">Family &amp; Friends</option>
        <option value="food-drink">Food &amp; Drink</option>
        <option value="health">Health</option>
        <option value="home">Home</option>
        <option value="it">IT</option>
        <option value="number">Number</option>
        <option value="place-direction">Place &amp; Direction</option>
        <option value="school">School</option>
        <option value="sport-leisure">Sport &amp; Leisure</option>
        <option value="time">Time</option>
        <option value="toy">Toy</option>
        <option value="transport">Transport</option>
        <option value="weather">Weather</option>
        <option value="work">Work</option>
        <option value="the-world-around-us">The World Around Us</option>
      </select>
    </div>

    <div style="margin-bottom: 20px">
      <button onclick="setMode('read')">READ</button>
      <button onclick="setMode('build')">BUILD</button>
      <button onclick="setMode('spell')">SPELL</button>
    </div>

    <div>
      <img id="image" src="" alt="word image" />
    </div>

    <div id="read-mode" style="margin-top: 20px">
      <p id="word-display" style="font-size: 100px"></p>
    </div>

    <div id="spell-mode" style="margin-top: 20px; display: none">
      <input id="input-word" placeholder="请输入单词" />
      <button onclick="checkAnswer()">CHECK</button>
      <p id="feedback"></p>
      <p id="correct-answer"></p>
    </div>

    <!-- BUILD 模式：点击词块，按顺序组成单词 -->
    <div id="build-mode" style="margin-top: 20px; display: none">
      <p>Build the word.</p>

      <div id="build-answer" class="chunk-area"></div>
      <div id="build-options" class="chunk-area"></div>

      <button onclick="checkBuild()">CHECK</button>
      <button onclick="resetBuild()">RESET</button>

      <p id="build-feedback" role="status"></p>
    </div>

    <div>
      <button onclick="showText()">SHOW</button>
      <button onclick="nextWord()">NEXT</button>
    </div>

    <script src="english-cards.js"></script>
  </body>
</html>
